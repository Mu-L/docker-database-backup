x-mariadb: &x-mariadb
  environment:
    MARIADB_ROOT_PASSWORD: secret
  labels:
    - jan-di.database-backup.enable=true
    - jan-di.database-backup.type=mariadb
    - jan-di.database-backup.password=secret

services:
  # All currently supported LTS versions. See https://endoflife.date/mariadb
  # Specify tag as major.minor

  docker-database-backup-mariadb-10-11:
    <<: *x-mariadb
    image: docker.io/mariadb:10.11

  docker-database-backup-mariadb-11-4:
    <<: *x-mariadb
    image: docker.io/mariadb:11.4

  docker-database-backup-mariadb-11-8:
    <<: *x-mariadb
    image: docker.io/mariadb:11.8

  docker-database-backup-mariadb-12-3:
    <<: *x-mariadb
    image: docker.io/mariadb:12.3
