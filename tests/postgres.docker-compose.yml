x-postgres: &x-postgres
  environment:
    POSTGRES_PASSWORD: secret
  labels:
    - jan-di.database-backup.enable=true
    - jan-di.database-backup.type=postgres
    - jan-di.database-backup.username=postgres
    - jan-di.database-backup.password=secret

services:
  # All currently supported major versions. See https://endoflife.date/postgresql
  # Specify tag as major

  docker-database-backup-postgres-18:
    <<: *x-postgres
    image: docker.io/postgres:18

  docker-database-backup-postgres-17:
    <<: *x-postgres
    image: docker.io/postgres:17

  docker-database-backup-postgres-16:
    <<: *x-postgres
    image: docker.io/postgres:16

  docker-database-backup-postgres-15:
    <<: *x-postgres
    image: docker.io/postgres:15

  docker-database-backup-postgres-14:
    <<: *x-postgres
    image: docker.io/postgres:14
